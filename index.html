const L="ABCD",app=document.getElementById("app");
let list,i,score,wrong,done;
function start(f){list=Q.filter(q=>!f||q[0]===f);i=0;score=0;wrong=[];ask()}
function home(){const ls=[...new Set(Q.map(q=>q[0]))];app.innerHTML='<div class="card"><p class="q">Choose what to practice.</p><div class="choices"><button class="primary" onclick="start(0)">All ('+Q.length+')</button>'+ls.map(l=>'<button class="primary" onclick="start('+l+')">Lesson '+l+' ('+Q.filter(q=>q[0]===l).length+')</button>').join("")+'</div></div>'}
function ask(){
 if(i>=list.length)return end();
 const q=list[i];done=false;
 app.innerHTML='<div class="meta"><span>Lesson '+q[0]+'</span><span>'+(i+1)+' of '+list.length+'</span></div><div class="bar"><i style="width:'+(i/list.length*100)+'%"></i></div><div class="card"><p class="q">'+q[1]+'</p><div id="o">'+q[2].map((t,k)=>'<button class="opt" onclick="pick('+k+')"><b>'+L[k]+'.</b> '+t+'</button>').join("")+'</div><div id="f"></div></div>';
}
function pick(k){
 if(done)return;done=true;const q=list[i],ok=k===q[3];
 if(ok)score++;else wrong.push(q);
 [...document.querySelectorAll(".opt")].forEach((b,n)=>{b.disabled=true;if(n===q[3])b.classList.add("ok");else if(n===k)b.classList.add("no")});
 document.getElementById("f").innerHTML='<div class="exp"><b>'+(ok?"Correct.":"Not quite.")+'</b> '+q[4]+'</div><button class="primary" onclick="i++;ask()">'+(i+1===list.length?"See results":"Next question")+'</button>';
}
function end(){
 const p=Math.round(score/list.length*100);
 app.innerHTML='<div class="card"><p class="score">'+score+' / '+list.length+'</p><p>'+p+'% correct.</p><div class="choices"><button class="primary" onclick="home()">Back to menu</button>'+(wrong.length?'<button class="primary" onclick="list=wrong;wrong=[];i=0;score=0;ask()">Retry '+wrong.length+' missed</button>':'')+'</div></div>'+(wrong.length?'<h2>Review missed items</h2>'+wrong.map(q=>'<div class="rev"><b>'+q[1]+'</b><br>Answer: '+q[2][q[3]]+'</div>').join(""):"");
}
home();
</script>
